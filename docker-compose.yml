services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: partspulse
      POSTGRES_PASSWORD: partspulse
      POSTGRES_DB: partspulse
    ports:
      - "5432:5432"
    volumes:
      - partspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://partspulse:partspulse@db:5432/partspulse
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      CORS_ORIGINS: http://localhost:5173
      EXCHANGE_API_BASE_URL: https://api.frankfurter.app
      BASE_CURRENCY: USD
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  partspulse_pgdata:
