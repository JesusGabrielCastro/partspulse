version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: partspulse
      POSTGRES_PASSWORD: partspulse
      POSTGRES_DB: partspulse
    ports:
      - "5432:5432"
    volumes:
      - partspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  partspulse_pgdata:
